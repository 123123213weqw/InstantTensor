[package]
name = "goldenbundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reader and comparator for qwen35-forward golden bundles (raw f32 + JSON manifest)"

[[bin]]
name = "bundlecmp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
