[workspace]
members = ["crates/stloader", "crates/stbench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Fuzzing must unwind: `catch_unwind` cannot observe a panic when the profile
# aborts the process. Keeps release's optimisation level otherwise.
[profile.fuzz]
inherits = "release"
panic = "unwind"
